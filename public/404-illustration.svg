<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#0A0F1A"/>
    </linearGradient>
    <linearGradient id="digits" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="frame"><rect width="640" height="360" rx="24"/></clipPath>
    <style>
      .wave-back { animation: drift 18s linear infinite; }
      .wave-front { animation: drift 11s linear infinite; }
      .boat { animation: bob 5s ease-in-out infinite; transform-origin: 320px 250px; }
      @keyframes drift { to { transform: translateX(-640px); } }
      @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(-7px) rotate(3deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wave-back, .wave-front, .boat { animation: none; }
      }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="640" height="360" fill="url(#sea)"/>
    <circle cx="500" cy="70" r="150" fill="#2563EB" fill-opacity="0.16"/>

    <!-- the number 404, behind the boat -->
    <g fill="none" stroke="url(#digits)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M212 58 144 166h104M222 118v108"/>
      <ellipse cx="320" cy="142" rx="44" ry="72"/>
      <path d="M460 58 392 166h104M470 118v108"/>
    </g>

    <!-- back wave (two 640px periods so the loop is seamless) -->
    <g class="wave-back">
      <path d="M0 262c53-22 107-22 160 0s107 22 160 0 107-22 160 0 107 22 160 0 107-22 160 0 107 22 160 0 107-22 160 0 107 22 160 0v110H0Z" fill="#2563EB" fill-opacity="0.55"/>
    </g>

    <!-- paper boat -->
    <g class="boat">
      <path d="M320 150 276 236h44Z" fill="#FFFFFF"/>
      <path d="M320 150l44 86h-44Z" fill="#C0C7D1"/>
      <path d="M236 236h168l-30 40H266Z" fill="#E6EDF5"/>
      <path d="M320 236h84l-30 40h-54Z" fill="#C0C7D1"/>
    </g>

    <!-- front wave -->
    <g class="wave-front">
      <path d="M0 284c53 20 107 20 160 0s107-20 160 0 107 20 160 0 107-20 160 0 107 20 160 0 107-20 160 0 107 20 160 0 107-20 160 0v90H0Z" fill="#22D3EE" fill-opacity="0.75"/>
    </g>
    <path d="M0 322c80-14 160-14 240 0s160 14 240 0 107-12 160-4v42H0Z" fill="#0A0F1A" fill-opacity="0.55"/>
  </g>
</svg>
